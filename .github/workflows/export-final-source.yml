name: Export final source snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 69a6ca5e0c575ddfa3dcbf48a6d3c3c3cbe382f1
          fetch-depth: 1
          lfs: true
          submodules: false
          path: source
      - name: Scan credentials
        run: |
          set -euo pipefail
          if grep -RIlE --binary-files=without-match --exclude-dir=.git --exclude='.env' --exclude='.env.local' 'sk-proj-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16}|LTAI[A-Za-z0-9]{12,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' source; then exit 1; fi
      - name: Build archive
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/export"; mkdir -p "$out"
          printf '%s\n' '{"repository":"lil-fahad/Internal-designer-","commit":"69a6ca5e0c575ddfa3dcbf48a6d3c3c3cbe382f1","history_included":false,"sensitive_local_files_excluded":true}' > "$out/manifest.json"
          tar -C source --exclude='.git' --exclude='.env' --exclude='.env.local' --exclude='.env.*.local' --exclude='.env.production' --exclude='.env.development' --exclude='.env.test' --exclude='*.pem' --exclude='*.key' --exclude='id_rsa*' --exclude='credentials*.json' --exclude='secrets*.json' --exclude='node_modules' --exclude='.venv' --exclude='venv' --exclude='__pycache__' --exclude='.pytest_cache' --exclude='.ruff_cache' -czf "$out/internal-designer.tar.gz" .
          sha256sum "$out/internal-designer.tar.gz" > "$out/internal-designer.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: internal-designer-source
          path: ${{ runner.temp }}/export/*
          retention-days: 7
          if-no-files-found: error
